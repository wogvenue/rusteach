# Rusteach — Müfredat planı (sıfırdan uzmanlığa)
# Each module lists: its tier, the lessons to write (title + what MUST be covered),
# and `new_concepts` (concepts introduced here). Authors may freely use every concept
# introduced in EARLIER modules plus the module's own concepts once taught; anything else
# only as a clearly labeled preview (see `previews`).
#
# Global previews allowed everywhere (explain in one sentence when first used in a module):
#   - println!/print!/format! with {}, {:?}, {x} inline args (from m01)
#   - .unwrap() / .expect("...") on parse() results (from m02 l06), as "şimdilik"
#   - String::from, .len(), .push_str() (from m04); Vec via vec![], .push(), .len(), v[i] (from m04)
#   - #[derive(Debug)] (from m06)
#   - simple closures |x| x * 2 only as arguments to sort_by_key/retain etc. (from m09 l05)
#   - for x in &v / v.iter() / s.chars() / .enumerate() (from m09)
#   - Box<dyn std::error::Error> as main's error type (from m10 l03)
#   - iterator adaptors map/filter/collect: only from m14 on

tiers:
  - id: t1
    title: Başlangıç Koyu
    subtitle: İlk adımlar — sözdizimi, değişkenler, akış
    color: "#22C55E"
    emoji: "🏝️"
  - id: t2
    title: Sahiplik Adası
    subtitle: Rust'ı Rust yapan fikir — sahiplik, ödünç alma, tipler
    color: "#F97316"
    emoji: "🌋"
  - id: t3
    title: Yapı Limanı
    subtitle: Kodu düzenlemek, veri toplamak, hatalarla başa çıkmak
    color: "#0EA5E9"
    emoji: "⚓"
  - id: t4
    title: Soyutlama Ormanı
    subtitle: Generic'ler, trait'ler, yaşam süreleri ve testler
    color: "#14B8A6"
    emoji: "🌲"
  - id: t5
    title: Fonksiyonel Vadi
    subtitle: Closure'lar, iterator'lar ve gerçek bir proje
    color: "#8B5CF6"
    emoji: "🏞️"
  - id: t6
    title: Eşzamanlılık Dağları
    subtitle: Akıllı işaretçiler, thread'ler ve async
    color: "#EC4899"
    emoji: "⛰️"
  - id: t7
    title: Desen Kanyonu
    subtitle: Trait nesneleri, desenler ve ileri tip sistemi
    color: "#EAB308"
    emoji: "🏜️"
  - id: t8
    title: Uzman Zirvesi
    subtitle: Makrolar, unsafe, performans ve gerçek dünya
    color: "#EF4444"
    emoji: "🏔️"

modules:
  # ───────────────────────────── TIER 1 ─────────────────────────────
  - id: m01
    dir: 01-merhaba-rust
    tier: t1
    title: Merhaba Rust
    new_concepts: |
      programming basics, compiled vs interpreted, rustup, rustc, cargo, fn main, println!, macros (the ! sign), comments, format strings, eprintln!, format!, compiler errors, rustfmt, clippy
    lessons:
      - title: Programlama nedir, Rust neden var?
        cover: |
          what a program is, source code -> compiler -> machine code, compiled vs interpreted (Python/JS vs C/Rust), the memory-safety problem (C/C++ bugs, ~70% of security bugs are memory bugs) and garbage collectors' cost, Rust's promise (safety + speed + fearless concurrency), who uses Rust (Linux kernel, Windows, Android, Firefox, Discord, Cloudflare, AWS), "most admired language" surveys, how this app works (steps, checks, SRS reviews, XP) and how to study (short daily sessions, retrieval > rereading)
      - title: Kurulum — rustup, rustc ve cargo
        cover: |
          installing on Windows via rustup-init.exe (rustup.rs), MSVC build tools vs GNU toolchain, rustc --version, cargo --version, rustup update, rustup doc / The Book offline, editor setup (VS Code + rust-analyzer), the in-app runner (local vs online Rust Playground) — code blocks here run online if Rust is not installed
      - title: İlk programın — Merhaba, Dünya!
        cover: |
          fn main, curly braces, println! is a macro (!), string literals, semicolons, compiling with rustc main.rs and running the .exe, what an executable is, small modifications exercise
      - title: Cargo ile proje yönetimi
        cover: |
          cargo new, project layout (Cargo.toml, src/main.rs, .gitignore), TOML basics, cargo build / cargo run / cargo check, debug vs --release, target/ directory, Cargo.lock intro, why cargo check is fast
      - title: Yorumlar ve çıktı biçimlendirme
        cover: |
          "// and /* */ comments, doc comment preview (///)", "println! placeholders {}, {:?}, positional {0}, named {ad}, inline {x}", "width/alignment/padding {:>8} {:<8} {:^8} {:08}", "precision {:.2}", "escaping {{ }}", "print! vs println!", "eprintln! (stderr)", "format! returns a String"
      - title: Derleyiciyle dost olmak
        cover: |
          anatomy of a compiler error (error[E0425], --> file:line:col, help/note lines), warnings vs errors, rustc --explain E0425, reading errors top-down, rustfmt (cargo fmt), clippy (cargo clippy), a "fix the errors" practice session

  - id: m02
    dir: 02-degiskenler-ve-tipler
    tier: t1
    title: Değişkenler ve Veri Tipleri
    new_concepts: |
      let, mut, const, static (intro), shadowing, integer types, overflow, float, bool, char, arithmetic, as casting, tuples, arrays, type inference, annotations, parse + unwrap preview
    lessons:
      - title: Değişkenler ve değişmezlik (immutability)
        cover: |
          let bindings, immutable by default and WHY (safety, reasoning, concurrency), E0384 error, mut keyword, when to use mut, naming conventions snake_case
      - title: Sabitler ve gölgeleme (shadowing)
        cover: |
          const with mandatory type and SCREAMING_SNAKE_CASE, compile-time evaluation, static intro, shadowing vs mut (can change type, new binding), shadowing in nested scopes, common uses (parsing input, transformations)
      - title: Tamsayılar ve taşma (overflow)
        cover: |
          i8..i128, u8..u128, isize/usize and pointer size, default i32, literals (1_000_000, 0xff, 0o77, 0b1010, b'A', suffixes 5u8), integer overflow (panic in debug, wraps in release), wrapping_add, checked_add (returns Option — preview), saturating_add, overflowing_add, integer division and % remainder
      - title: Ondalık sayılar, bool ve char
        cover: |
          f64 default vs f32, floating point precision (0.1+0.2), arithmetic operators, compound assignment (+=), bool and logical operators (&&, ||, !), comparisons, char is a 4-byte Unicode scalar value ('ş', '🦀'), casting with as (and lossy casts, truncation)
      - title: Bileşik tipler — tuple ve dizi
        cover: |
          tuples with mixed types, access .0 .1, destructuring let (a, b) = t, unit type (), arrays [T; N] fixed size on stack, [0; 5] initializer, indexing, .len(), out-of-bounds panic at runtime (and compile-time detection for constants), when array vs Vec (Vec preview)
      - title: Tip çıkarımı ve tip belirtme
        cover: |
          type inference, explicit annotations, when annotation is required, "\"42\".parse::<i32>() and turbofish ::<>", ".unwrap()/.expect() as preview (Module 10)", type mismatch errors E0308, statically typed vs dynamically typed

  - id: m03
    dir: 03-fonksiyonlar-ve-akis
    tier: t1
    title: Fonksiyonlar ve Kontrol Akışı
    new_concepts: |
      fn with params and return, expressions vs statements, blocks as expressions, if/else if/else, if as expression, loop with break value, while, for over ranges and arrays, .rev(), labels, continue, std::io::stdin read_line (in project only), match on Ordering (preview)
    lessons:
      - title: Fonksiyonlar
        cover: |
          defining functions, parameters must have types, return types with ->, calling order doesn't matter, snake_case, why explicit signatures (documentation, local reasoning)
      - title: İfadeler ve deyimler (expressions vs statements)
        cover: |
          statement vs expression, let is a statement, blocks {} are expressions, the last expression without semicolon is the value, the semicolon pitfall (E0308 with ()), implicit return vs return keyword, early return
      - title: Koşullar — if / else
        cover: |
          if condition must be bool (no truthiness, E0308), else if chains, if as an expression in let, both branches same type, nesting vs early return, a small grade calculator
      - title: Döngüler — loop, while, for
        cover: |
          loop with break, returning a value from loop (break value), while loops, for over arrays and ranges (1..5, 1..=5), .rev(), loop labels 'outer for nested loops, continue, choosing the right loop, off-by-one errors
      - title: "Proje: Sayı tahmin oyunu"
        type: project
        cover: |
          build the Rust Book guessing game step by step as a cargo project the learner runs locally (rust,norun for stdin parts), std::io::stdin().read_line(&mut s) explained gently, adding the rand crate in Cargo.toml (dependency preview), parse and trim, comparing with if/else (and std::cmp::Ordering + match as a short preview), loop until correct, extracting pure functions (e.g. fn karsilastir(tahmin, gizli) -> &'static str -- or return a simple enum-free String) so in-app exercises can test the logic without stdin

  # ───────────────────────────── TIER 2 ─────────────────────────────
  - id: m04
    dir: 04-sahiplik
    tier: t2
    title: Sahiplik (Ownership)
    new_concepts: |
      stack vs heap, String type, ownership rules, scope and drop, move, clone, Copy types, ownership through functions, Vec as a heap-owning type (preview)
    lessons:
      - title: Bellek nasıl çalışır — stack ve heap
        cover: |
          memory diagram based explanation, stack (LIFO, fixed size, fast) vs heap (dynamic size, allocation, pointer), how C (manual malloc/free) and Java/Python (GC) handle memory and their failure modes (leaks, double free, use-after-free, dangling pointers, GC pauses), Rust's third way
      - title: Sahiplik kuralları ve kapsam (scope)
        cover: |
          the 3 ownership rules, variable scope, String vs &'static str literal (literal stored in the binary), String::from, push_str, drop called automatically at end of scope, RAII idea
      - title: Taşıma (move)
        cover: |
          let s2 = s1 for String moves ownership (memory diagram with steps), why not a shallow copy (double free), E0382 borrow of moved value — reading the error, moves into function arguments, moves in loops (preview), Vec also moves
      - title: Clone ve Copy
        cover: |
          clone() deep copy and its cost, Copy types (integers, floats, bool, char, tuples/arrays of Copy), why String is not Copy, clone as a conscious decision — not a fix-all
      - title: Sahiplik ve fonksiyonlar
        cover: |
          passing a value moves it (unless Copy), returning values transfers ownership, returning a tuple to give ownership back — and why this is tedious (motivation for references in Module 5)

  - id: m05
    dir: 05-odunc-alma-ve-dilimler
    tier: t2
    title: Ödünç Alma ve Dilimler
    new_concepts: |
      "references &T", "dereference *", "mutable references &mut T", borrowing rules, NLL, dangling references, "string slices &str", "array slices &[T]", "&mut [T]"
    lessons:
      - title: Referanslar ve ödünç alma
        cover: |
          & creates a reference, borrowing analogy (lending a book), functions taking &String, references are immutable by default, memory diagram of a reference pointing to a stack var pointing to heap, dereference with * (and auto-deref for method calls)
      - title: Değiştirilebilir referanslar
        cover: |
          &mut T, the rule — either ONE &mut or ANY number of & (aliasing XOR mutation), E0499 and E0502, why — data races and iterator invalidation in C++, non-lexical lifetimes (NLL) — borrow ends at last use, scopes to separate borrows
      - title: Sarkan referanslar (dangling)
        cover: |
          what a dangling pointer is, Rust prevents it at compile time, E0106 missing lifetime specifier when returning a reference to a local (lifetimes preview Module 12), fix by returning owned String
      - title: Dilimler — &str ve &[T]
        cover: |
          slices as a reference to part of a collection (pointer + length), string slices &s[0..5], range syntax shortcuts, first_word example and how slices keep you safe (s.clear() conflict), string literals are &str, prefer &str parameters, UTF-8 byte boundaries and the panic when slicing in the middle of 'ş', array slices &a[1..3] and &mut [T]
      - title: Borrow checker ile düşünmek
        cover: |
          systematic approach to borrow errors — who owns, who borrows, how long; common fixes (shorten borrow, clone deliberately, restructure, return owned data, index instead of reference), many compiles/doesn't-compile checks, mental model summary

  - id: m06
    dir: 06-yapilar
    tier: t2
    title: Yapılar (Structs)
    new_concepts: |
      struct definition, instantiation, field init shorthand, struct update syntax, tuple structs, unit structs, "#[derive(Debug)]", "{:?} {:#?}", dbg!, impl blocks, methods with self/&self/&mut self, associated functions, Self, multiple impl blocks
    lessons:
      - title: Struct tanımlamak ve kullanmak
        cover: |
          grouping related data, defining a struct, creating instances, accessing and mutating fields (whole instance must be mut), field init shorthand, struct update syntax ..other and its move semantics, ownership of fields (String vs &str fields — why owned for now)
      - title: Tuple struct'lar ve birim struct'lar
        cover: |
          tuple structs (struct Renk(u8,u8,u8)), newtype idea for type safety (Metre vs Fit), unit-like structs, when to use which
      - title: Debug ile yazdırma
        cover: |
          "#[derive(Debug)]", "{:?} and {:#?}", "dbg! macro (returns ownership, prints to stderr with file:line)", "why Display isn't derived (preview of traits in Module 11)"
      - title: Metotlar
        cover: |
          impl block, &self, &mut self, self (consuming) and when each is right, method call syntax and automatic referencing, methods with extra parameters, getters naming convention
      - title: İlişkili fonksiyonlar ve kurucular
        cover: |
          "associated functions without self (String::from style)", "new() constructors convention", Self keyword, "multiple impl blocks", ":: vs . syntax"
      - title: "Proje: Kütüphane envanteri"
        type: project
        cover: |
          design a small Kitap/Kutuphane model with structs, methods (ekle, odunc_ver, iade_et, listele) using Vec<Kitap> (preview Vec), tests-checked exercises for each method, refactoring from loose variables to structs

  - id: m07
    dir: 07-enumlar-ve-match
    tier: t2
    title: Enum'lar ve Desen Eşleştirme
    new_concepts: |
      enum definition, variants with data, enum methods, Option<T>, Some/None, match, exhaustiveness, binding in patterns, "_ placeholder", if let, let else, while let, matches!
    lessons:
      - title: Enum'lar — bir değer, birçok olasılık
        cover: |
          enum definition, variants with no data / tuple data / struct-like data, enum vs struct choice, impl on enums, example — IpAddr, Mesaj, OyunKomutu
      - title: Option — null'suz dünya
        cover: |
          Tony Hoare's billion dollar mistake, Option<T> with Some and None, why Option<i32> + i32 doesn't compile, getting the value out (match; unwrap_or as preview), Option in struct fields
      - title: match ifadesi
        cover: |
          match arms and patterns, exhaustiveness checking (E0004), binding values from variants, matching Option, catch-all with a variable or _, match as an expression, matching on integers/ranges/chars, arms returning the same type
      - title: if let, let else ve while let
        cover: |
          if let for one interesting pattern, else branch, let ... else for early return (modern idiom), while let with a Vec stack pop(), matches! macro
      - title: Enum'larla modelleme
        cover: |
          making illegal states unrepresentable, state machine example (TrafikIsigi, SiparisDurumu), enum + match vs if-chains, enums with impl and methods that consume self to transition states, combining structs and enums

  # ───────────────────────────── TIER 3 ─────────────────────────────
  - id: m08
    dir: 08-moduller-ve-crateler
    tier: t3
    title: Modüller, Paketler ve Crate'ler
    new_concepts: |
      package, crate (binary/library), module tree, mod, pub, privacy, paths crate::/super::/self::, use, as, pub use re-export, nested/glob imports, splitting modules into files, external dependencies, semver, Cargo.lock, crates.io, docs.rs
    lessons:
      - title: Paket, crate ve modül kavramları
        cover: |
          package vs crate vs module, binary crate vs library crate, crate root (main.rs / lib.rs), module tree diagram, why modules (organization + privacy)
      - title: mod, pub ve gizlilik kuralları
        cover: |
          inline mod blocks, private by default, pub on modules/functions/structs/fields, pub struct fields vs pub enum variants, E0603 private item error, encapsulation with constructors
      - title: Yollar ve use
        cover: |
          absolute paths crate::, relative paths, super::, self::, use to bring into scope, idiomatic use (function's parent module vs full path for types), as aliases, pub use re-exports, nested paths use std::{io, fmt}, glob imports and when to avoid
      - title: Modülleri dosyalara bölmek
        cover: |
          src/lib.rs + src/main.rs pattern, mod kutuphane; -> kutuphane.rs or kutuphane/mod.rs, nested module files (modern style without mod.rs), project layout of a real crate (rust,ignore for multi-file)
      - title: Dış crate'ler ve crates.io
        cover: |
          adding dependencies in Cargo.toml / cargo add, semantic versioning (^1.2.3), Cargo.lock purpose, crates.io and docs.rs, using rand / regex in code (runnable online), the std library as a crate, choosing quality crates

  - id: m09
    dir: 09-koleksiyonlar
    tier: t3
    title: Koleksiyonlar
    new_concepts: |
      Vec<T> in depth, String in depth (UTF-8), HashMap, entry API, HashSet, BTreeMap, VecDeque, BinaryHeap, sorting, searching, simple closures in sort_by_key/retain (preview)
    lessons:
      - title: Vec — büyüyebilen diziler
        cover: |
          Vec::new, vec![], push, pop, indexing vs get (Option), iterating with for &v and &mut v, borrow rules with vectors (E0502 when pushing while holding a reference — why, reallocation diagram), Vec of enums for mixed data, capacity vs len, with_capacity
      - title: String derinlemesine
        cover: |
          String vs &str recap, UTF-8 encoding (bytes vs chars vs grapheme clusters), why s[0] doesn't compile, push / push_str / + operator (takes ownership of left side) / format!, .chars() .bytes(), Turkish letters take 2 bytes ('ş'.len_utf8()), to_uppercase and Turkish İ/ı caveat, trim, split_whitespace, contains, replace
      - title: HashMap — anahtar-değer depoları
        cover: |
          HashMap::new, insert, get (returns Option<&V>), ownership of keys/values, iterating (order not guaranteed), updating — overwrite, entry().or_insert, modify via returned &mut, word frequency counter, hashing note (SipHash, DoS resistance)
      - title: Diğer koleksiyonlar
        cover: |
          HashSet (uniqueness, set ops union/intersection), BTreeMap (sorted keys), VecDeque (queue from both ends), BinaryHeap (priority queue, max-heap, Reverse), choosing a collection — table of Big-O
      - title: Sıralama, arama ve filtreleme
        cover: |
          sort, sort_unstable, sort_by with cmp, sort_by_key with a simple closure (closure preview — Module 14), reverse, binary_search, contains, dedup, retain, iter().max()/min() returning Option, sorting floats (partial_cmp / total_cmp)

  - id: m10
    dir: 10-hata-yonetimi
    tier: t3
    title: Hata Yönetimi
    new_concepts: |
      panic!, unwinding vs abort, RUST_BACKTRACE, Result<T,E>, Ok/Err, matching on Result, unwrap/expect, unwrap_or/unwrap_or_else/unwrap_or_default, ? operator, main returning Result, Box<dyn Error> (preview), "? on Option", custom error enums, map_err, ok_or, when to panic
    lessons:
      - title: "panic! — kurtarılamaz hatalar"
        cover: |
          panic! macro, what happens on panic (unwinding stack, cleanup), panic = 'abort' profile option, RUST_BACKTRACE=1, panics from library code (index out of bounds), panic is for bugs not for expected failures
      - title: Result ile kurtarılabilir hatalar
        cover: |
          enum Result<T, E>, functions that return Result (parse, File::open), matching Ok/Err, matching on different error kinds, unwrap vs expect (good expect messages), unwrap_or, unwrap_or_else, unwrap_or_default, is_ok/is_err
      - title: "? operatörü ile hata yayma"
        cover: |
          error propagation manually with match then with ?, ? only in functions returning Result/Option (E0277), chaining calls with ?, main() -> Result<(), Box<dyn std::error::Error>> (preview with note), ? on Option, ok_or to convert Option to Result, map_err
      - title: Kendi hata tiplerin
        cover: |
          designing an error enum (HesapHatasi::YetersizBakiye{..}), returning Result<T, HesapHatasi>, matching errors to give user messages, keeping errors as data, preview — Display/Error/From traits make this nicer in Module 11
      - title: panic mi, Result mı?
        cover: |
          guidelines — examples/prototypes/tests vs libraries, invariants and contracts, validation with types (Yas::new returning Result so invalid values can't exist), expect with reasoning when you know more than the compiler, a decision checklist

  # ───────────────────────────── TIER 4 ─────────────────────────────
  - id: m11
    dir: 11-genericler-ve-traitler
    tier: t4
    title: Generic'ler ve Trait'ler
    new_concepts: |
      generic functions, generic structs/enums/methods, monomorphization, trait definition, impl Trait for Type, default methods, trait bounds, where clauses, impl Trait args/returns, derive and std traits (Debug, Clone, Copy, PartialEq, Eq, PartialOrd, Ord, Hash, Default), Display, From/Into, TryFrom, FromStr, AsRef, std::error::Error, orphan rule, blanket impls, const generics
    lessons:
      - title: Generic fonksiyonlar
        cover: |
          motivation — duplicate largest_i32/largest_char, type parameter <T>, why the naive generic largest needs a bound (E0369 → PartialOrd), turbofish with generic functions
      - title: Generic struct, enum ve metotlar
        cover: |
          struct Nokta<T>, multiple type params <T, U>, Option<T> and Result<T,E> are generic enums, impl<T> Nokta<T>, impl Nokta<f64> specific methods, method generics differ from struct generics, monomorphization — zero runtime cost, code size tradeoff
      - title: Trait'ler — ortak davranış
        cover: |
          trait as shared behavior/contract (interface analogy), defining trait Ozet, impl Ozet for Haber, default implementations, calling other trait methods from defaults, traits vs inheritance
      - title: Trait sınırları
        cover: |
          fn bildir(item: &impl Ozet), generic form <T: Ozet>, multiple bounds T: Ozet + Display, where clauses, returning impl Trait (single concrete type rule), conditional method impls impl<T: Display + PartialOrd> Cift<T>
      - title: derive ve standart trait'ler
        cover: |
          what derive generates, Debug, Clone vs Copy (Copy requires Clone, all fields Copy), PartialEq/Eq, PartialOrd/Ord (lexicographic field order), Hash (for HashMap keys), Default (..Default::default()), when you cannot derive
      - title: Dönüşüm ve biçimlendirme trait'leri
        cover: |
          impl fmt::Display (to_string for free), From and Into (implement From, get Into), TryFrom for fallible conversions, FromStr enabling .parse(), AsRef<str> for flexible params, implementing std::error::Error for a custom error + From so that ? converts errors automatically (completes Module 10)
      - title: Trait kuralları — orphan rule ve blanket impl
        cover: |
          coherence and the orphan rule (E0117), newtype workaround (preview of Module 22), blanket implementations (impl<T: Display> ToString for T), const generics struct Matris<const N: usize>, choosing generic vs concrete

  - id: m12
    dir: 12-yasam-sureleri
    tier: t4
    title: Yaşam Süreleri (Lifetimes)
    new_concepts: |
      "lifetime annotations 'a", lifetimes in function signatures, lifetimes in structs, elision rules, "'static", "T: 'a bounds", lifetimes with generics and traits
    lessons:
      - title: Yaşam süresi nedir?
        cover: |
          every reference has a lifetime, the borrow checker compares scopes (diagram with 'a and 'b brackets), dangling reference example revisited, lifetimes are descriptive not prescriptive — they don't change how long values live
      - title: Fonksiyonlarda yaşam süresi anotasyonları
        cover: |
          longest(x, y) and E0106, syntax &'a str, meaning — result lives at most as long as the shorter input, calls that compile vs don't (compiles checks), when only one parameter needs 'a, returning a reference to a local can never work
      - title: Referans tutan struct'lar
        cover: |
          struct Alinti<'a> { parca: &'a str }, the struct can't outlive the data, impl<'a> blocks, methods returning references to fields, owned vs borrowed struct design tradeoffs
      - title: Elision kuralları ve 'static
        cover: |
          the three elision rules step by step on examples, method elision with &self, 'static lifetime (string literals), misuse of 'static as an error-silencer, T: 'static bound meaning (owns its data), T: 'a
      - title: Yaşam süreleriyle ustalaşmak
        cover: |
          generics + trait bounds + lifetimes together, reading complex signatures, common lifetime errors and fixes (return owned, restructure, split borrows), multiple lifetime params 'a 'b and when needed, a practical text tokenizer returning &str slices

  - id: m13
    dir: 13-test-yazmak
    tier: t4
    title: Test Yazmak
    new_concepts: |
      "#[test]", "#[cfg(test)]", assert!, assert_eq!, assert_ne!, custom failure messages, "#[should_panic(expected=...)]", tests returning Result, "#[ignore]", cargo test options, unit vs integration tests, tests/ directory, doc comments /// and //!, doc tests, cargo doc, TDD
    lessons:
      - title: İlk testlerin
        cover: |
          why automated tests, #[cfg(test)] mod tests with use super::*, #[test] functions, assert!, assert_eq!, assert_ne! (left/right output), custom messages with format args, testing private functions, reading test output
      - title: Panik ve Result döndüren testler
        cover: |
          "#[should_panic] and expected = substring", "tests returning Result<(), String> with ?", "#[ignore]", "cargo test name_filter, -- --nocapture, -- --test-threads=1, --ignored"
      - title: Birim ve entegrasyon testleri
        cover: |
          unit tests next to code, integration tests in tests/ as external users of the crate (only pub API), tests/common/mod.rs for helpers, binary crates and lib.rs pattern (rust,ignore for file layout)
      - title: Dokümantasyon ve doc testleri
        cover: |

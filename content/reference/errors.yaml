    Tipi açıkça söyledik: `<Zar as Uretici>::uret()` ya da kısaca `Zar::uret()`.

- code: E0392
  title: "Kullanılmayan tip parametresi"
  module: m22
  explanation: |
    Bir struct veya enum'da tanımladığın genel parametre alanlarda hiç **kullanılmıyorsa** derleyici reddeder: `type parameter `T` is never used`. Çünkü `T`'nin yaşam süresi ve değişkenlik (variance) davranışı belirlenemez.

    Bazen tür düzeyinde bir işaret gerekir (örneğin `Kimlik<Kullanici>` ile `Kimlik<Siparis>`'in karıştırılmasını önlemek istersin).
  bad: |
    struct Kimlik<T> {
        numara: u64,
    }
  fix: |
    use std::marker::PhantomData;

    struct Kimlik<T> {
        numara: u64,
        _tur: PhantomData<T>,
    }

    enum Kullanici {}
    enum Siparis {}

    fn main() {
        let k: Kimlik<Kullanici> = Kimlik { numara: 7, _tur: PhantomData };
        let s: Kimlik<Siparis> = Kimlik { numara: 7, _tur: PhantomData };
        println!("kullanıcı #{}, sipariş #{}", k.numara, s.numara);
    }
  fix_explanation: |
    `PhantomData<T>` alanı ekledik: sıfır boyutlu bir işaretçi tip, yalnızca `T`'yi "kullanılmış" göstermek için vardır. Bu, **tür güvenli kimlik** (typed ID) gibi desenlerin temelidir. `T`'ye gerçekten ihtiyaç yoksa parametreyi kaldır.

- code: E0620
  title: "Boyutsuz tipe dönüşüm"
  module: m22
  explanation: |
    `as [i32]` ile **boyutsuz** bir tipe (dilim) dönüşüm yapamazsın: `cast to unsized type: `&[i32; 3]` as `[i32]``. Dilimin kendisi (`[i32]`) boyutsuz bir tiptir ve yalnızca işaretçi arkasında var olabilir.
  bad: |
    fn main() {
        let dizi = [1, 2, 3];
        let dilim = &dizi as [i32];
        println!("{}", dilim.len());
    }
  fix: |
    fn main() {
        let dizi = [1, 2, 3];
        let dilim = &dizi as &[i32];
        let dilim2: &[i32] = &dizi[..];
        println!("{} {}", dilim.len(), dilim2.len());
    }
  fix_explanation: |
    Hedef tipi referans olarak yazdık: `&[i32]`. Dönüşüm yerine tip belirtimi ile (`let dilim: &[i32] = &dizi;`) ya da aralık indeksiyle (`&dizi[..]`) da aynı sonuç alınır.

- code: E0133
  title: "Güvenli olmayan işlem unsafe dışında"
  module: m24
  explanation: |
    Ham işaretçiyi (`*const T`, `*mut T`) dereference etmek, `unsafe` bir fonksiyonu çağırmak gibi işlemler yalnızca bir **`unsafe` blok** içinde yapılabilir: `dereference of raw pointer is unsafe and requires unsafe function or block`.

    Rust bu işlemlerin güvenli olduğunu kendisi kanıtlayamaz; `unsafe` blok "derleyici, bunu ben doğruladım" demektir. Sorumluluk programcıdadır.
  bad: |
    fn main() {
        let x = 42;
        let p = &raw const x;
        println!("{}", *p);
    }
  fix: |
    fn main() {
        let x = 42;
        let p = &raw const x;
        // SAFETY: `p`, hâlâ canlı olan `x`'i gösteriyor ve hizalı.
        let deger = unsafe { *p };
        println!("{deger}");
    }
  fix_explanation: |
    Dereference'ı `unsafe { *p }` bloğuna aldık ve bloğun neden güvenli olduğunu `// SAFETY:` yorumuyla belgeledik. İyi uygulama: `unsafe` blokları mümkün olduğunca küçük tut ve güvenli bir arayüzün arkasına sakla.

- code: E0199
  title: "Güvenli trait için unsafe impl"
  module: m24
  explanation: |
    Güvenli (normal) bir trait'i `unsafe impl` ile uygulayamazsın: `implementing the trait `Clone` is not unsafe`. `unsafe impl`, yalnızca `unsafe trait` olarak tanımlanmış trait'ler içindir (örneğin `Send`, `Sync`).
  bad: |
    #[derive(Debug)]
    struct Sayac(u32);

    unsafe impl Clone for Sayac {
        fn clone(&self) -> Self {
            Sayac(self.0)
        }
    }

    fn main() {
        let a = Sayac(1);
        println!("{:?}", a.clone());
    }
  fix: |
    #[derive(Debug)]
    struct Sayac(u32);

    impl Clone for Sayac {
        fn clone(&self) -> Self {
            Sayac(self.0)
        }
    }

    fn main() {
        let a = Sayac(1);
        println!("{:?}", a.clone());
    }
  fix_explanation: |
    `unsafe` anahtar sözcüğünü kaldırdık; `Clone` güvenli bir trait'tir.

- code: E0200
  title: "Unsafe trait için impl unsafe değil"
  module: m24
  explanation: |
    `unsafe trait`'i uygulamak, derleyicinin doğrulayamadığı bir sözleşmeyi **senin garanti etmen** demektir. Bu yüzden `unsafe impl` olarak yazılmalıdır: `the trait `Hizali16` requires an `unsafe impl` declaration`.
  bad: |
    /// # Safety
    /// Bu trait'i uygulayan tipler 16 bayta hizalı olmalıdır.
    unsafe trait Hizali16 {}

    #[repr(align(16))]
    struct Tampon([u8; 16]);

    impl Hizali16 for Tampon {}
  fix: |
    /// # Safety
    /// Bu trait'i uygulayan tipler 16 bayta hizalı olmalıdır.
    unsafe trait Hizali16 {}

    #[repr(align(16))]
    struct Tampon([u8; 16]);

    // SAFETY: `repr(align(16))` sayesinde Tampon her zaman 16 bayta hizalıdır.
    unsafe impl Hizali16 for Tampon {}

    fn hizalama<T: Hizali16>(_: &T) -> usize {
        std::mem::align_of::<T>()
    }

    fn main() {
        let t = Tampon([0; 16]);
        println!("{} bayt, hizalama {}", t.0.len(), hizalama(&t));
    }
  fix_explanation: |
    Uygulamayı `unsafe impl` yaptık ve neden güvenli olduğunu `// SAFETY:` yorumuyla açıkladık.

- code: E0793
  title: "Paketlenmiş alana referans"
  module: m24
  explanation: |
    `#[repr(packed)]` bir struct'ın alanları hizalanmamış (unaligned) olabilir. Böyle bir alana referans (`&p.uzunluk`) almak, hizasız referans yaratır ve bu tanımsız davranıştır: `reference to packed field is unaligned`.
  bad: |
    #[repr(C, packed)]
    struct Paket {
        tur: u8,
        uzunluk: u32,
    }

    fn main() {
        let p = Paket { tur: 1, uzunluk: 512 };
        let r = &p.uzunluk;
        println!("tür {}, uzunluk {r}", p.tur);
    }
  fix: |
    #[repr(C, packed)]
    struct Paket {
        tur: u8,
        uzunluk: u32,
    }

    fn main() {
        let p = Paket { tur: 1, uzunluk: 512 };
        let uzunluk = p.uzunluk;
        let tur = p.tur;
        println!("tür {tur}, uzunluk {uzunluk}");
    }
  fix_explanation: |
    Alanı önce **yerel bir değişkene kopyaladık** (`let uzunluk = p.uzunluk;`); `Copy` tipler için değer kopyalamak güvenlidir. Gerçekten işaretçi gerekirse `&raw const p.uzunluk` ve `read_unaligned` kullanılır.

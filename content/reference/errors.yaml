    }
  fix: |
    trait Uretici {
        fn uret() -> u32;
    }

    struct Zar;

    impl Uretici for Zar {
        fn uret() -> u32 {
            4
        }
    }

    fn main() {
        let x = <Zar as Uretici>::uret();
        let y = Zar::uret();

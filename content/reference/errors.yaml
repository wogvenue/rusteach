- code: E0403
  title: "Aynı genel parametre adı iki kez"
  module: m11
  explanation: |
    Bir genel parametre listesinde aynı ad iki kez kullanılamaz: `the name `T` is already used for a generic parameter in this item's generic parameters`. `<T, T>` derleyici için belirsizdir.

    Farklı tipler gerekiyorsa farklı adlar vermelisin. Örnekte `ikili(1, "bir")` iki farklı tip alır; tek `T` bu çağrıyı zaten kabul etmezdi.
  bad: |
    fn ikili<T, T>(a: T, b: T) -> (T, T) {
        (a, b)
    }

    fn main() {
        let (x, y) = ikili(1, "bir");
        println!("{x} {y}");
    }
  fix: |
    fn ikili<T, U>(a: T, b: U) -> (T, U) {
        (a, b)
    }

    fn main() {
        let (x, y) = ikili(1, "bir");
        println!("{x} {y}");
    }
  fix_explanation: |
    İkinci parametreye başka bir ad (`U`) verdik. Her iki argümanın aynı tipte olması gerekiyorsa tek `T` kullanıp çağrıyı da buna göre yaz.

- code: E0204
  title: "Copy türetilemiyor"
  module: m11
  explanation: |
    `Copy` trait'i, tipin tüm alanları da `Copy` ise türetilebilir. `String` heap'te veri tuttuğu için `Copy` değildir; bu yüzden onu içeren struct de `Copy` olamaz: `the trait `Copy` cannot be implemented for this type`.

    Bu, sahipliğin temel güvencesidir. Bit düzeyinde kopyalanan heap işaretçisi çift serbest bırakmaya yol açardı.
  bad: |
    #[derive(Debug, Clone, Copy)]
    struct Oyuncu {
        isim: String,
        can: u32,
    }

    fn main() {
        let o1 = Oyuncu { isim: String::from("Ferris"), can: 100 };
        let o2 = o1;
        println!("{o1:?} {o2:?}");
    }
  fix: |
    #[derive(Debug, Clone)]
    struct Oyuncu {
        isim: String,
        can: u32,
    }

    fn main() {
        let o1 = Oyuncu { isim: String::from("Ferris"), can: 100 };
        let o2 = o1.clone();
        println!("{o1:?} {o2:?}");
        println!("{} {}", o2.isim, o2.can);
    }
  fix_explanation: |
    `Copy`'yi kaldırdık, yalnızca `Clone` bıraktık ve kopyayı açıkça `clone()` ile aldık. Struct'ın tüm alanları `Copy` ise (`u32`, `f64`, `char`...) `#[derive(Clone, Copy)]` geçerlidir.

- code: E0261
  title: "Tanımsız yaşam süresi"
  module: m12
  explanation: |
    `'a` gibi bir yaşam süresi adını kullanmadan önce fonksiyon (veya impl/struct) adının yanındaki `<...>` içinde **bildirmen** gerekir: `use of undeclared lifetime name `'a``. Genel tip parametreleri (`<T>`) ile aynı mantıktır.

    Yaşam süresi parametresi, derleyiciye "şu referanslar birbiriyle ilişkilidir" demenin yoludur; bildirilmeden kullanılamaz.
  bad: |
    fn ilk_kelime(metin: &'a str) -> &'a str {
        metin.split(' ').next().unwrap_or("")
    }

    fn main() {
        println!("{}", ilk_kelime("merhaba dünya"));
    }
  fix: |
    fn ilk_kelime<'a>(metin: &'a str) -> &'a str {
        metin.split(' ').next().unwrap_or("")
    }

    fn main() {
        println!("{}", ilk_kelime("merhaba dünya"));
    }
  fix_explanation: |
    `<'a>` bildirimini fonksiyon adından sonra ekledik: `fn ilk_kelime<'a>(...)`. Bu örnekte yaşam süresi **elision** kuralları zaten çözeceği için `fn ilk_kelime(metin: &str) -> &str` yazmak da yeterlidir.

- code: E0262
  title: "Geçersiz yaşam süresi parametresi adı"
  module: m12
  explanation: |
    `'static` özel bir yaşam süresidir ("programın sonuna kadar") ve genel parametre olarak **bildirilemez**: `invalid lifetime parameter name: `'static``. `'_` için de aynısı geçerlidir.

    Kendi parametrelerin için `'a`, `'b` gibi sıradan adlar kullan.
  bad: |
    fn ilk<'static>(s: &'static str) -> &'static str {
        s
    }

    fn main() {
        println!("{}", ilk("Rust"));
    }
  fix: |
    fn ilk<'a>(s: &'a str) -> &'a str {
        s
    }

    fn main() {
        println!("{}", ilk("Rust"));
    }
  fix_explanation: |
    Parametreyi `'a` olarak adlandırdık. Referansın gerçekten programın sonuna kadar yaşaması gerekiyorsa bildirim yapmadan doğrudan `&'static str` yaz.

- code: E0621
  title: "Parametrede yaşam süresi eksik"
  module: m12
  explanation: |
    Fonksiyon dönüş değerini `'a` ile bağlamış, ama `y` parametresine bu yaşam süresini vermemişsin. Derleyici `y`'nin yeterince yaşayacağını garanti edemez: `explicit lifetime required in the type of `y``.

    `if x > y { x } else { y }` ifadesinin sonucu iki referanstan biri olabilir; ikisinin de dönüş değeri kadar yaşaması gerekir.
  bad: |
    fn buyuk<'a>(x: &'a i32, y: &i32) -> &'a i32 {
        if x > y { x } else { y }
    }

    fn main() {
        let a = 5;
        let b = 9;
        println!("{}", buyuk(&a, &b));
    }
  fix: |
    fn buyuk<'a>(x: &'a i32, y: &'a i32) -> &'a i32 {
        if x > y { x } else { y }
    }

    fn main() {
        let a = 5;
        let b = 9;
        println!("{}", buyuk(&a, &b));
    }
  fix_explanation: |
    `y`'ye de `'a` verdik: `y: &'a i32`. Artık "sonuç, iki girdinin **kısa olanı** kadar yaşar" garantisi var. Bu, Modül 12'deki `longest` fonksiyonunun temel kuralıdır.

- code: E0310
  title: "Parametre tipi yeterince yaşamayabilir"
  module: m12
  explanation: |
    `Box<dyn Debug>` varsayılan olarak `'static` yaşam süresi bekler; yani içindeki veri program boyunca geçerli olabilmelidir. Ancak genel `T` içinde referans taşıyan bir tip de olabilir: `the parameter type `T` may not live long enough`.

    Derleyici `T`'nin `'static` olduğundan emin olmak ister, çünkü `T` kısa ömürlü bir referans içerseydi kutudaki veri sarkan referans olurdu.
  bad: |
    use std::fmt::Debug;

    fn kutula<T: Debug>(x: T) -> Box<dyn Debug> {
        Box::new(x)
    }

    fn main() {
        println!("{:?}", kutula(5));
    }
  fix: |
    use std::fmt::Debug;

    fn kutula<T: Debug + 'static>(x: T) -> Box<dyn Debug> {
        Box::new(x)
    }

    fn main() {
        println!("{:?}", kutula(5));
        println!("{:?}", kutula(String::from("sahipli veri")));
    }
  fix_explanation: |
    `T: Debug + 'static` sınırını ekledik. `'static` sınırı, "`T` ödünç alınmış kısa ömürlü referans içermez" demektir (sahipli tipler uygundur). Daha esnek olması gerekiyorsa `Box<dyn Debug + 'a>` ile yaşam süresi parametresi de ekleyebilirsin.

- code: E0726
  title: "Gizli yaşam süresi kullanımı"
  module: m12
  explanation: |
    Yaşam süresi parametresi olan bir tipin `impl` bloğunda parametreyi **gizleyemezsin**: `implicit elided lifetime not allowed here`. `impl Alinti` yazmak, `Alinti<'a>`'daki `'a`'yı okuyucudan saklar.
  bad: |
    struct Alinti<'a> {
        parca: &'a str,
    }

    impl Alinti {
        fn parca(&self) -> &str {
            self.parca
        }
    }
  fix: |
    struct Alinti<'a> {
        parca: &'a str,
    }

    impl Alinti<'_> {
        fn parca(&self) -> &str {
            self.parca
        }
    }

    fn main() {
        let roman = String::from("Bana İsmail deyin. Yıllar önce...");
        let ilk_cumle = roman.split('.').next().unwrap();
        let a = Alinti { parca: ilk_cumle };
        println!("{}", a.parca());
    }
  fix_explanation: |
    `impl Alinti<'_>` yazdık: `'_` "anonim yaşam süresi" demektir ve parametrenin var olduğunu açıkça gösterir. Yaşam süresini bir ada ihtiyaç duyulan yerde kullanacaksan `impl<'a> Alinti<'a>` yaz.

- code: E0283
  title: "Tip belirlenemedi (birden çok olasılık)"
  module: m14
  explanation: |
    `sum()` hangi tipte toplam döndürebileceği trait ile belirlenen bir fonksiyondur (`Sum`); birden çok tip uygun olabilir. Sonuç tipi başka bir yerden belli olmazsa: `type annotations needed`.

    `E0282`'nin kardeşidir: derleyici burada tipi hiç çıkaramadığı için değil, **birden çok geçerli seçenek** olduğu için karar veremiyor.
  bad: |
    fn main() {
        let notlar = [85, 92, 78];
        let toplam = notlar.iter().sum();
        println!("Toplam: {toplam}");
    }
  fix: |
    fn main() {
        let notlar = [85, 92, 78];
        let toplam: i32 = notlar.iter().sum();
        let adet = notlar.iter().count();
        println!("Toplam: {toplam}, ortalama: {}", toplam / adet as i32);
    }
  fix_explanation: |
    Sonuç değişkenine tip verdik: `let toplam: i32`. Alternatif olarak turbofish yazılabilir: `.sum::<i32>()`.

- code: E0593
  title: "Closure argüman sayısı uyuşmuyor"
  module: m14
  explanation: |
    `map` bir argümanlı bir closure bekler (her eleman için bir değer). İki parametreli closure verirsen: `closure is expected to take 1 argument, but it takes 2 arguments`.

    Closure'ın kaç parametre alacağı, çağrıldığı yerin beklentisiyle uyuşmak zorundadır. Başka bir değeri closure'a dışarıdan **yakalama (capture)** ile taşırsın; parametre olarak değil.
  bad: |
    fn main() {
        let fiyatlar = vec![10, 20, 30];
        let zamli: Vec<i32> = fiyatlar.iter().map(|fiyat, oran| fiyat * oran).collect();
        println!("{zamli:?}");
    }
  fix: |
    fn main() {
        let fiyatlar = vec![10, 20, 30];
        let oran = 2;
        let zamli: Vec<i32> = fiyatlar.iter().map(|fiyat| fiyat * oran).collect();
        println!("{zamli:?}");
    }
  fix_explanation: |
    İkinci değeri parametre yapmak yerine dışarıdaki `oran` değişkeninden **yakaladık**. Closure'lar çevrelerindeki değişkenlere doğrudan erişebilir.

- code: E0525
  title: "Closure beklenen trait'i uygulamıyor"
  module: m14
  explanation: |
    Closure'lar yaptıkları işe göre `Fn`, `FnMut` ya da `FnOnce` olur. Yakaladığı değeri **tüketen** (`drop(rapor)`) bir closure yalnızca bir kez çağrılabilir; bu yüzden yalnızca `FnOnce`'tır. İki kez çağıran fonksiyon `Fn` isterse: `expected a closure that implements the `Fn` trait, but this closure only implements `FnOnce``.

    Mesaj closure'ın neden `FnOnce` olduğunu da gösterir: `closure is `FnOnce` because it moves the variable `rapor` out of its environment`.
  bad: |
    fn iki_kez_cagir<F: Fn()>(f: F) {
        f();
        f();
    }

    fn main() {
        let rapor = String::from("rapor.txt");
        let gonder = move || {
            println!("{rapor} gönderiliyor");
            drop(rapor);
        };
        iki_kez_cagir(gonder);
    }
  fix: |
    fn bir_kez_cagir<F: FnOnce()>(f: F) {
        f();
    }

    fn main() {
        let rapor = String::from("rapor.txt");
        let gonder = move || {
            println!("{rapor} gönderiliyor");
            drop(rapor);
        };
        bir_kez_cagir(gonder);
    }
  fix_explanation: |
    Çağıran fonksiyonu `FnOnce` bekleyecek şekilde değiştirdik ve yalnızca bir kez çağırdık. Closure'ın birden çok kez çalışması gerekiyorsa, içeride yakaladığı değeri tüketmemeli (örneğin `clone()` ya da referans kullan).

- code: E0631
  title: "Closure argüman tipi uyuşmuyor"
  module: m14
  explanation: |
    Closure parametresine yazdığın tip, çağıranın verdiği tiple uyuşmuyor: `type mismatch in closure arguments`. `v.iter()` elemanları **referans** (`&i32`) verir; closure ise `i32` bekliyor.

    İterator'ların `iter()`, `iter_mut()` ve `into_iter()` varyantları farklı eleman tipleri üretir; closure parametreleri buna uymalıdır.
  bad: |
    fn main() {
        let v = vec![1, 2, 3];
        v.iter().for_each(|x: i32| println!("{}", x * 2));
    }
  fix: |
    fn main() {
        let v = vec![1, 2, 3];
        v.iter().for_each(|x: &i32| println!("{}", x * 2));
        v.iter().for_each(|&x| println!("{}", x * 3));
    }
  fix_explanation: |
    Closure parametresini `&i32` yaptık. Alternatif: tip yazmayıp çıkarıma bırakmak ya da `|&x|` kalıbıyla referansı açmak (`x` artık `i32`).

- code: E0267
  title: "Closure içinde break/continue"
  module: m14
  explanation: |
    `break` ve `continue`, **closure sınırını geçemez**: `break` inside of a closure. Closure ayrı bir fonksiyondur; dıştaki döngü onun için görünmez. Yani `for_each` içinden döngüyü kıramazsın.

    Bu davranışa ihtiyacın varsa döngü yerine iterator zinciri (`take_while`, `find`, `try_for_each`) kullanılır.
  bad: |
    fn main() {
        let sayilar = [1, 2, 3, 4];
        sayilar.iter().for_each(|x| {
            if *x == 3 {
                break;
            }
            println!("{x}");
        });
    }
  fix: |
    fn main() {
        let sayilar = [1, 2, 3, 4];
        for x in sayilar.iter() {
            if *x == 3 {
                break;
            }
            println!("{x}");
        }
    }
  fix_explanation: |
    `for_each` yerine sıradan bir `for` döngüsü yazdık; `break` döngünün içinde geçerlidir. Aynı iş `sayilar.iter().take_while(|x| **x != 3)` ile de yapılabilirdi.

- code: E0767
  title: "Etiket closure'ın dışında"
  module: m14
  explanation: |
    Etiketli `break 'dis;` ifadesi, etiketin tanımlı olduğu döngüden **closure sınırını geçerek** çıkmaya çalışıyor: `use of unreachable label `'dis``. Closure'lar dış döngüye "erişemez"; `E0267` ile aynı mantık.
  bad: |
    fn main() {
        let mut sayac = 0;
        'dis: loop {
            let mut adim = || loop {
                sayac += 1;
                if sayac > 3 {
                    break 'dis;
                }
            };
            adim();
        }
    }
  fix: |
    fn main() {
        let mut sayac = 0;
        let mut adim = || {
            sayac += 1;
            sayac > 3
        };
        loop {
            if adim() {
                break;
            }
        }
        println!("Sayaç: {sayac}");
    }
  fix_explanation: |
    Closure'dan döngüyü kırmak yerine bir **durum bilgisi** (`bool`) döndürdük ve kararı dış döngüye bıraktık. Bu, closure'lar arası kontrol akışını çözmenin genel yoludur.

- code: E0434
  title: "İç fonksiyon dış değişkeni yakalayamaz"
  module: m14
  explanation: |
    `fn` ile tanımlanan iç fonksiyonlar çevrelerindeki yerel değişkenleri **yakalayamaz**: `can't capture dynamic environment in a fn item`. İç fonksiyon, dışarıdaki bir fonksiyondan farksızdır; sadece bir bloğun içinde yazılmıştır.

    Yakalama özelliği yalnızca **closure'lara** aittir.
  bad: |
    fn main() {
        let carpan = 3;
        println!("Çarpan: {carpan}");
        fn carp(x: i32) -> i32 {
            x * carpan
        }
        println!("{}", carp(5));
    }
  fix: |
    fn main() {
        let carpan = 3;
        println!("Çarpan: {carpan}");
        let carp = |x: i32| x * carpan;
        println!("{}", carp(5));
    }
  fix_explanation: |
    İç fonksiyon yerine **closure** yazdık: `|x: i32| x * carpan`. Closure ortamdaki `carpan`'ı yakalar. Fonksiyon kalmasını istiyorsan değeri parametre olarak ilet.

- code: E0271
  title: "İlişkili tip uyuşmuyor"
  module: m14
  explanation: |
    `Iterator<Item = u32>` sınırı, eleman tipinin tam olarak `u32` olmasını ister. `&str` üreten bir iterator verirsen: `type mismatch resolving `<IntoIter<&str> as Iterator>::Item == u32``.

    Mesaj iki tarafı karşılaştırır: beklenen (`expected `u32``) ve bulunan (`found `&str``).
  bad: |
    fn hepsini_yaz<I: Iterator<Item = u32>>(ogeler: I) {
        for x in ogeler {
            println!("{x}");
        }
    }

    fn main() {
        let v = vec!["bir", "iki"];
        hepsini_yaz(v.into_iter());
    }
  fix: |
    use std::fmt::Display;

    fn hepsini_yaz<I>(ogeler: I)
    where
        I: Iterator,
        I::Item: Display,
    {
        for x in ogeler {
            println!("{x}");
        }
    }

    fn main() {
        let v = vec!["bir", "iki"];
        hepsini_yaz(v.into_iter());
        hepsini_yaz(vec![1u32, 2].into_iter());
    }
  fix_explanation: |
    Fonksiyonu eleman tipinde **genel** yaptık: `I::Item: Display`. Böylece her tip için çalışır. Eleman tipinin gerçekten `u32` olması gerekiyorsa çağıran tarafta iterator'ı dönüştür (`map`, `filter_map`).

- code: E0220
  title: "Olmayan ilişkili tip"
  module: m14
  explanation: |
    `Iterator<Itme = u32>` yazarken ilişkili tipin adını yanlış yazdın: ``associated type `Itme` not found for `Iterator` ``. `Iterator`'ın ilişkili tipi `Item`'dır.

    Derleyici `help: there is an associated type with a similar name: `Item`` diyerek doğrusunu önerir.
  bad: |
    fn kac_tane<I: Iterator<Itme = u32>>(sayilar: I) -> usize {
        sayilar.count()
    }

    fn main() {
        println!("{}", kac_tane(vec![3, 12, 40].into_iter()));
    }
  fix: |
    fn kac_tane<I: Iterator<Item = u32>>(sayilar: I) -> usize {
        sayilar.count()
    }

    fn main() {
        println!("{}", kac_tane(vec![3, 12, 40].into_iter()));
    }
  fix_explanation: |
    Adı `Item` olarak düzelttik.

- code: E0562
  title: "impl Trait yanlış konumda"
  module: m14
  explanation: |
    `impl Trait` yalnızca **fonksiyon parametresi** ve **dönüş tipi** konumlarında kullanılabilir. `let` bildirimi için geçerli değildir: `` `impl Trait` is not allowed in the type of variable bindings ``.

    Closure'ın tipi adlandırılamaz; bu yüzden değişkeni `impl Fn` diye tanımlamak yerine tipi çıkarıma bırakmalısın.
  bad: |
    fn main() {
        let artir: impl Fn(i32) -> i32 = |x| x + 1;
        println!("{}", artir(41));
    }
  fix: |
    fn main() {
        let artir = |x: i32| x + 1;
        let kutulu: Box<dyn Fn(i32) -> i32> = Box::new(|x| x * 2);
        println!("{} {}", artir(41), kutulu(21));
    }
  fix_explanation: |
    Tip yazmadan closure'ı doğrudan değişkene bağladık. Closure'ları depolarken tipin farklı olabileceği durumlar için `Box<dyn Fn(i32) -> i32>` kullanılır.

- code: E0658
  title: "Kararsız (unstable) özellik"
  module: m16
  explanation: |
    Bazı standart kütüphane metotları ve dil özellikleri **henüz kararlı (stable) değildir** ve yalnızca nightly derleyicide, `#![feature(...)]` ile açılabilir: `use of unstable library feature `iter_intersperse``.

    Stable derleyicide kullanılan her şey geriye dönük uyumluluk garantisi taşır; kararsız özellikler ise değişebilir veya kaldırılabilir. Bu yüzden Rust'ta bir metot belgede "Nightly-only" ya da "unstable" notuyla işaretliyse üretim kodunda kullanılmamalıdır.
  bad: |
    fn main() {
        let meyveler = vec!["elma", "armut", "kiraz"];
        let liste: String = meyveler.into_iter().intersperse(", ").collect();
        println!("{liste}");
    }
  fix: |
    fn main() {
        let meyveler = vec!["elma", "armut", "kiraz"];
        let liste = meyveler.join(", ");
        println!("{liste}");
    }
  fix_explanation: |
    Aynı işi **kararlı** bir yöntemle (`join`) yaptık: `meyveler.join(", ")`. Nightly derleyici gerçekten gerekiyorsa `rustup toolchain install nightly` ve `#![feature(...)]` kullanırsın, ama üretim kodunda kaçınmalısın.

- code: E0072
  title: "Sonsuz boyutlu özyinelemeli tip"
  module: m17
  explanation: |
    `Dugum(i32, Liste)` şeklinde, bir tipin içinde **kendisini doğrudan** barındırması imkânsızdır: derleyici boyutunu hesaplayamaz çünkü `Liste` = `i32` + `Liste` = `i32` + `i32` + `Liste`... sonsuza kadar sürer: `recursive type `Liste` has infinite size`.

    Çözüm, kendi kendini içeren kısmı **heap'e** koymaktır. İşaretçinin boyutu sabittir (8 bayt) ve heap'teki veri gerektiği kadar büyüyebilir.
  bad: |
    enum Liste {
        Dugum(i32, Liste),
        Bos,
    }

    fn toplam(liste: &Liste) -> i32 {
        match liste {
            Liste::Dugum(deger, kalan) => deger + toplam(kalan),
            Liste::Bos => 0,
        }
    }

    fn main() {
        let liste = Liste::Dugum(1, Liste::Dugum(2, Liste::Bos));
        println!("Toplam: {}", toplam(&liste));
    }
  fix: |
    enum Liste {
        Dugum(i32, Box<Liste>),
        Bos,
    }

    fn toplam(liste: &Liste) -> i32 {
        match liste {
            Liste::Dugum(deger, kalan) => deger + toplam(kalan),
            Liste::Bos => 0,
        }
    }

    fn main() {
        let liste = Liste::Dugum(1, Box::new(Liste::Dugum(2, Box::new(Liste::Bos))));
        println!("Toplam: {}", toplam(&liste));
    }
  fix_explanation: |
    Özyinelemeli alanı `Box<Liste>` yaptık: `Box`, veriyi heap'te tutar ve stack'te sabit boyutlu bir işaretçi bırakır. Aynı yöntem ağaç ve bağlı liste yapılarında da kullanılır (`Option<Box<Dugum>>`).

- code: E0040
  title: "drop metodunu elle çağırma"
  module: m17
  explanation: |
    `Drop::drop` metodunu elle çağıramazsın: `explicit use of destructor method`. Derleyici kapsam bittiğinde `drop`'u kendisi çağırır; elle çağırırsan değer **iki kez** yıkılırdı (çift serbest bırakma).

    Değeri erken bırakmak istiyorsan başka bir yol var.
  bad: |
    struct Dosya;

    impl Drop for Dosya {
        fn drop(&mut self) {
            println!("dosya kapatıldı");
        }
    }

    fn main() {
        let d = Dosya;
        println!("dosya açık");
        d.drop();
        println!("program devam ediyor");
    }
  fix: |
    struct Dosya;

    impl Drop for Dosya {
        fn drop(&mut self) {
            println!("dosya kapatıldı");
        }
    }

    fn main() {
        let d = Dosya;
        println!("dosya açık");
        drop(d);
        println!("program devam ediyor");
    }
  fix_explanation: |
    Standart kütüphanenin **`drop(değer)`** fonksiyonunu kullandık. Bu fonksiyon değeri **taşır** ve kapsamının bittiği noktada yıkıcıyı çağırır; böylece derleyici sonradan ikinci kez yıkmaz.

- code: E0509
  title: "Drop uygulayan tipten alan taşıma"
  module: m17
  explanation: |
    `Drop` uygulayan bir struct'ın alanını dışarı **taşıyamazsın**: `cannot move out of type `Dosya`, which implements the `Drop` trait`. Alan çıkarıldıktan sonra `drop` çalıştığında geçersiz bir alanı kullanmaya çalışırdı.
  bad: |
    struct Dosya {
        ad: String,
    }

    impl Drop for Dosya {
        fn drop(&mut self) {
            println!("{} kapatıldı", self.ad);
        }
    }

    fn main() {
        let d = Dosya { ad: String::from("notlar.txt") };
        let ad = d.ad;
        println!("Dosya adı: {ad}");
    }
  fix: |
    struct Dosya {
        ad: String,
    }

    impl Drop for Dosya {
        fn drop(&mut self) {
            println!("{} kapatıldı", self.ad);
        }
    }

    fn main() {
        let d = Dosya { ad: String::from("notlar.txt") };
        let ad = &d.ad;
        println!("Dosya adı: {ad}");
    }
  fix_explanation: |
    Alanı taşımak yerine **ödünç aldık** (`&d.ad`). Değeri gerçekten dışarı çıkarmak gerekiyorsa `clone()`, `std::mem::take`, ya da alanı `Option` yapıp `take()` etmek yaygın çözümlerdir.

- code: E0184
  title: "Copy ve Drop birlikte"
  module: m17
  explanation: |
    Bir tip hem `Copy` hem `Drop` olamaz: `the trait `Copy` cannot be implemented for this type; the type has a destructor`. `Copy` tipler bit düzeyinde sessizce çoğaltılır; her kopya için `drop` çağrılsaydı kaynak (dosya, bağlantı) birden çok kez serbest bırakılırdı.
  bad: |
    #[derive(Clone, Copy)]
    struct Baglanti {
        id: u32,
    }

    impl Drop for Baglanti {
        fn drop(&mut self) {
            println!("bağlantı {} kapatıldı", self.id);
        }
    }

    fn main() {
        let b = Baglanti { id: 1 };
        let _kopya = b;
    }
  fix: |
    #[derive(Clone)]
    struct Baglanti {
        id: u32,
    }

    impl Drop for Baglanti {
        fn drop(&mut self) {
            println!("bağlantı {} kapatıldı", self.id);
        }
    }

    fn main() {
        let b = Baglanti { id: 1 };
        let mut kopya = b.clone();
        kopya.id = 2;
        println!("iki bağlantı: {} ve {}", b.id, kopya.id);
    }
  fix_explanation: |
    `Copy`'yi kaldırıp yalnızca `Clone` bıraktık; kopyalama artık açıkça `clone()` ile oluyor. `Drop` uygulayan tipler her zaman tek sahipli kalmalıdır.

- code: E0373
  title: "Closure thread'den uzun yaşayabilir"
  module: m18
  explanation: |
    `thread::spawn` ile başlattığın thread, çağıran fonksiyondan daha uzun yaşayabilir; bu yüzden closure'ın yakaladığı referanslar **sarkan** hâle gelebilir: `closure may outlive the current function, but it borrows `v``.

    Closure varsayılan olarak yakaladığı değişkeni **ödünç alır**. Thread ana thread'den bağımsız çalıştığı için derleyici bu ödüncün yeterince uzun yaşayacağını garanti edemez.
  bad: |
    use std::thread;

    fn main() {
        let v = vec![1, 2, 3];
        let h = thread::spawn(|| {
            println!("Thread'deki vektör: {v:?}");
        });
        h.join().unwrap();
    }
  fix: |
    use std::thread;

    fn main() {
        let v = vec![1, 2, 3];
        let h = thread::spawn(move || {
            println!("Thread'deki vektör: {v:?}");
        });
        h.join().unwrap();
    }
  fix_explanation: |
    Closure'a **`move`** ekledik: değişkenin sahipliği closure'a (dolayısıyla thread'e) geçer. Veriyi hem ana thread hem thread kullanacaksa `Arc` ile paylaş (Modül 18) ya da `thread::scope` kullan.

- code: E0521
  title: "Ödünç alınmış veri thread'den kaçıyor"
  module: m18
  explanation: |
    `mesaj: &str` bir **ödünç alınmış** referanstır ve yaşam süresi fonksiyonla sınırlıdır. `thread::spawn` ise `'static` bir closure ister; thread fonksiyondan sonra da çalışabilir: `borrowed data escapes outside of function`.

    `move` yazmak referansı thread'e taşır, ama referansın gösterdiği **veri** yine ödünçtür; bu yüzden hata sürer.
  bad: |
    use std::thread;

    fn arka_planda_yaz(mesaj: &str) {
        let h = thread::spawn(move || {
            println!("{mesaj}");
        });
        h.join().unwrap();
    }

    fn main() {
        arka_planda_yaz("merhaba");
    }
  fix: |
    use std::thread;

    fn arka_planda_yaz(mesaj: &str) {
        let mesaj = mesaj.to_string();
        let h = thread::spawn(move || {
            println!("{mesaj}");
        });
        h.join().unwrap();
    }

    fn kapsamli_yaz(mesaj: &str) {
        thread::scope(|s| {
            s.spawn(|| println!("{mesaj} (scope içinden)"));
        });
    }

    fn main() {
        arka_planda_yaz("merhaba");
        kapsamli_yaz("merhaba");
    }
  fix_explanation: |
    İlk çözümde metni **sahipli** bir `String`'e çevirdik (`to_string()`); artık thread kendi verisine sahip. İkinci çözümde **`thread::scope`** kullandık: kapsamlı thread'ler, bloktan önce bitmek zorunda oldukları için ödünç alınmış veriyi güvenle kullanabilir.

- code: E0728
  title: "async olmayan yerde await"
  module: m19
  explanation: |
    `.await` yalnızca bir **`async` fonksiyonun ya da bloğun** içinde kullanılabilir: `await` is only allowed inside `async` functions and blocks. Sıradan `fn main` içinde `await` yazamazsın; çünkü `await`, görevi bekletip yürütücüye (executor) geri dönmek demektir ve normal fonksiyonların böyle bir mekanizması yoktur.
  bad: |
    async fn veri_getir() -> u32 {
        42
    }

    fn main() {
        let veri = veri_getir().await;
        println!("{veri}");
    }
  fix: |
    pub async fn veri_getir() -> u32 {
        42
    }

    pub async fn isle() -> u32 {
        let veri = veri_getir().await;
        veri + 1
    }
  fix_explanation: |
    `await` kullandığımız kodu bir `async fn` içine koyduk. Programın giriş noktasında bir async çalışma zamanı (örneğin `tokio`'nun `#[tokio::main]` makrosu) gerekir; bu ders dışı örnekte yalnızca kitaplık fonksiyonu olarak gösterdik.

- code: E0733
  title: "Kutulanmamış async özyineleme"
  module: m19
  explanation: |
    `async fn` kendi kendini doğrudan çağırırsa, derlenen durum makinesi **kendi tipini içerirdi** ve boyutu sonsuz olurdu: `recursion in an async fn requires boxing`. Bu, `E0072`'nin async karşılığıdır.

    Çözüm, özyinelemeli çağrıyı bir `Box` içine alıp heap'e koymaktır.
  bad: |
    pub async fn geri_say(n: u32) {
        if n > 0 {
            geri_say(n - 1).await;
        }
    }
  fix: |
    pub async fn geri_say(n: u32) {
        if n > 0 {
            Box::pin(geri_say(n - 1)).await;
        }
    }
  fix_explanation: |
    Özyinelemeli çağrıyı **`Box::pin(...)`** ile sardık; böylece iç future heap'te yaşar ve dıştaki future'ın boyutu sabit kalır.

- code: E0746
  title: "dyn Trait doğrudan döndürülemez"
  module: m20
  explanation: |
    Dönüş tipi `dyn Sekil` olamaz: `return type cannot be a trait object without pointer indirection`. `dyn Trait` bir **boyutsuz (unsized)** tiptir; derleyici stack'te ne kadar yer ayıracağını bilmez. Bu yüzden her zaman bir işaretçinin arkasında (`&dyn`, `Box<dyn>`) kullanılmalıdır.
  bad: |
    trait Sekil {
        fn alan(&self) -> f64;
    }

    struct Kare(f64);

    impl Sekil for Kare {
        fn alan(&self) -> f64 {
            self.0 * self.0
        }
    }

    fn sekil_uret() -> dyn Sekil {
        Kare(2.0)
    }
  fix: |
    trait Sekil {
        fn alan(&self) -> f64;
    }

    struct Kare(f64);

    impl Sekil for Kare {
        fn alan(&self) -> f64 {
            self.0 * self.0
        }
    }

    fn sekil_uret() -> Box<dyn Sekil> {
        Box::new(Kare(2.0))
    }

    fn main() {
        println!("Alan: {}", sekil_uret().alan());
    }
  fix_explanation: |
    `Box<dyn Sekil>` döndürdük: kutu sabit boyutlu bir işaretçidir, içindeki gerçek tip çalışma anında belirlenir. Fonksiyon her zaman **aynı** somut tipi döndürüyorsa `impl Sekil` daha ucuz bir seçenektir.

- code: E0782
  title: "dyn anahtar sözcüğü eksik"
  module: m20
  explanation: |
    Edition 2021'den itibaren trait nesnesi tipleri **`dyn` ile** yazılmalıdır: `expected a type, found a trait`. `&Ses` yazdığında derleyici `Ses`'in bir tip mi yoksa bir trait mi olduğunu ayıramaz; `dyn` bunu netleştirir ve "burada dinamik dağıtım var" diye okuyucuyu uyarır.
  bad: |
    trait Ses {
        fn ses(&self) -> String;
    }

    struct Kedi;

    impl Ses for Kedi {
        fn ses(&self) -> String {
            String::from("miyav")
        }
    }

    fn konustur(hayvan: &Ses) {
        println!("{}", hayvan.ses());
    }

    fn main() {
        konustur(&Kedi);
    }
  fix: |
    trait Ses {
        fn ses(&self) -> String;
    }

    struct Kedi;

    impl Ses for Kedi {
        fn ses(&self) -> String {
            String::from("miyav")
        }
    }

    fn konustur(hayvan: &dyn Ses) {
        println!("{}", hayvan.ses());
    }

    fn main() {
        konustur(&Kedi);
    }
  fix_explanation: |
    `&dyn Ses` yazdık. Derleyici `help: add `dyn` keyword before this trait` diyerek çözümü kendisi söyler.

- code: E0038
  title: "Nesne güvenli olmayan trait"
  module: m20
  explanation: |
    Her trait `dyn Trait` olarak kullanılamaz; yalnızca **nesne güvenli (dyn compatible)** olanlar kullanılabilir: `the trait `Sekil` is not dyn compatible`. Burada `kopyala(&self) -> Self` metodu sorun çıkarıyor: çalışma anında `Self`'in gerçek tipi bilinmediği için dönüş değerinin boyutu bilinemez.

    Başlıca kurallar: metot `Self` tipini döndürmemeli ya da parametre olarak almamalı, metotlar genel (generic) olmamalı, trait `Sized`'ı gerektirmemeli.

    Mesajdaki `...because method `kopyala` references the `Self` type in its return type` satırı hangi metodun sorunlu olduğunu gösterir.
  bad: |
    trait Sekil {
        fn alan(&self) -> f64;
        fn kopyala(&self) -> Self;
    }

    struct Kare(f64);

    impl Sekil for Kare {
        fn alan(&self) -> f64 {
            self.0 * self.0
        }

        fn kopyala(&self) -> Self {
            Kare(self.0)
        }
    }

    fn main() {
        let sekiller: Vec<Box<dyn Sekil>> = vec![Box::new(Kare(2.0))];
        for s in &sekiller {
            println!("{}", s.alan());
        }
    }
  fix: |
    trait Sekil {
        fn alan(&self) -> f64;
        fn kopyala(&self) -> Self
        where
            Self: Sized;
    }

    struct Kare(f64);

    impl Sekil for Kare {
        fn alan(&self) -> f64 {
            self.0 * self.0
        }

        fn kopyala(&self) -> Self {
            Kare(self.0)
        }
    }

    fn main() {
        let sekiller: Vec<Box<dyn Sekil>> = vec![Box::new(Kare(2.0))];
        for s in &sekiller {
            println!("{}", s.alan());
        }
        let k = Kare(3.0).kopyala();
        println!("{}", k.alan());
    }
  fix_explanation: |
    Sorunlu metodu `where Self: Sized` ile işaretledik. Böylece metot trait nesnesinden **dışlanır** (yalnızca somut tipte çağrılabilir) ve trait geri kalanıyla nesne güvenli olur. Alternatif: metodu `Box<dyn Sekil>` döndürecek şekilde yeniden tasarlamak.

- code: E0225
  title: "dyn içinde birden çok trait"
  module: m20
  explanation: |
    `dyn Display + Debug` yazamazsın; bir trait nesnesinde yalnızca **bir ana trait** olabilir, geri kalanlar yalnızca **otomatik trait'ler** (`Send`, `Sync`, `Unpin`) olabilir: `only auto traits can be used as additional traits in a trait object`.
  bad: |
    use std::fmt::{Debug, Display};

    fn goster(x: &(dyn Display + Debug)) {
        println!("{x} / {x:?}");
    }

    fn main() {
        goster(&5);
    }
  fix: |
    use std::fmt::{Debug, Display};

    trait Gosterilebilir: Display + Debug {}

    impl<T: Display + Debug> Gosterilebilir for T {}

    fn goster(x: &dyn Gosterilebilir) {
        println!("{x} / {x:?}");
    }

    fn main() {
        goster(&5);
        goster(&"yengeç");
    }
  fix_explanation: |
    İki trait'i birleştiren bir **üst trait** tanımladık (`Gosterilebilir: Display + Debug`) ve onu `T: Display + Debug` olan her tip için **genel (blanket)** olarak uyguladık. Artık `&dyn Gosterilebilir` kullanabiliriz.

- code: E0224
  title: "Boş trait nesnesi"
  module: m20
  explanation: |
    `dyn 'static` biçimindeki bir trait nesnesinde **hiçbir trait yok**, yalnızca bir yaşam süresi var: `at least one trait is required for an object type`. `dyn`'den sonra en az bir ana trait yazılmalıdır.
  bad: |
    fn main() {
        let kutular: Vec<Box<dyn 'static>> = Vec::new();
        println!("{}", kutular.len());
    }
  fix: |
    use std::any::Any;

    fn main() {
        let kutular: Vec<Box<dyn Any>> = vec![Box::new(5), Box::new("metin")];
        for k in &kutular {
            if let Some(n) = k.downcast_ref::<i32>() {
                println!("sayı: {n}");
            } else if let Some(s) = k.downcast_ref::<&str>() {
                println!("metin: {s}");
            }
        }
    }
  fix_explanation: |
    Gerçek bir trait olan `Any` kullandık. `Box<dyn Any>`, farklı tiplerden değerleri aynı koleksiyonda tutar ve `downcast_ref` ile geri çözmeni sağlar. Ortak davranış gerekiyorsa kendi trait'ini tanımla.

- code: E0005
  title: "Reddedilebilir kalıp let içinde"
  module: m21
  explanation: |
    `let` kalıpları **reddedilmez** (irrefutable) olmak zorundadır: her değerle eşleşmelidir. `Some(n)` ise `None` değeriyle eşleşmez: `refutable pattern in local binding`. `let` "eşleşmezse ne yapacağım?" sorusuna yanıt vermez.

    Reddedilebilir kalıplar için `if let`, `match` ya da `let ... else` gerekir.
  bad: |
    fn main() {
        let secim: Option<u32> = Some(3);
        let Some(n) = secim;
        println!("Seçilen: {n}");
    }
  fix: |
    fn main() {
        let secim: Option<u32> = Some(3);
        let Some(n) = secim else {
            println!("Seçim yapılmadı");
            return;
        };
        println!("Seçilen: {n}");
    }
  fix_explanation: |
    **`let else`** kullandık: kalıp eşleşmezse `else` bloğu çalışır ve bu blok mutlaka akışı terk etmelidir (`return`, `break`, `panic!`). Değeri yalnızca bir koşulda kullanacaksan `if let Some(n) = secim { ... }` de uygundur.

- code: E0026
  title: "Kalıpta olmayan struct alanı"
  module: m21
  explanation: |
    Struct kalıbında, struct'ta olmayan bir alan adı yazdın: `struct `Nokta` does not have a field named `z``. Kalıptaki her ad ya struct'ın bir alanı ya da `alan: yeni_ad` şeklinde yeniden adlandırma olmalıdır.
  bad: |
    struct Nokta {
        x: i32,
        y: i32,
    }

    fn main() {
        let p = Nokta { x: 1, y: 2 };
        let Nokta { x, z, .. } = p;
        println!("{x} {z}");
    }
  fix: |
    struct Nokta {
        x: i32,
        y: i32,
    }

    fn main() {
        let p = Nokta { x: 1, y: 2 };
        let Nokta { x, y: z } = p;
        println!("{x} {z}");
    }
  fix_explanation: |
    `y: z` yazarak `y` alanını `z` adıyla bağladık. Alanı yalnızca okumak istiyorsan doğrudan `y` yaz; kullanmayacaksan `..` ekle.

- code: E0027
  title: "Kalıpta eksik struct alanı"
  module: m21
  explanation: |
    Struct kalıbı, struct'ın **tüm alanlarını** listelemelidir: `pattern does not mention field `sinif``. Derleyici hangi alanın unutulduğunu söyler.

    Bu yüzden struct'a yeni bir alan eklediğinde kalıp kullanan yerler hata verir ve yeni alanı gözden geçirmeni sağlar.
  bad: |
    struct Ogrenci {
        ad: String,
        yas: u32,
        sinif: u8,
    }

    fn main() {
        let o = Ogrenci { ad: String::from("Mert"), yas: 15, sinif: 9 };
        let Ogrenci { ad, yas } = o;
        println!("{ad} {yas}");
    }
  fix: |
    struct Ogrenci {
        ad: String,
        yas: u32,
        sinif: u8,
    }

    fn main() {
        let o = Ogrenci { ad: String::from("Mert"), yas: 15, sinif: 9 };
        let Ogrenci { ad, yas, .. } = o;
        println!("{ad} {yas} ({}. sınıf)", o.sinif);
    }
  fix_explanation: |
    Kalan alanları **`..`** ile yok saydık. Kalıbı kapatırken `..` yazmak "geri kalan alanlarla ilgilenmiyorum" demektir.

- code: E0029
  title: "Aralık kalıbı için geçersiz tip"
  module: m21
  explanation: |
    Aralık kalıpları (`'A'..='M'`, `1..=5`) yalnızca **sayılar ve `char`** için çalışır; metinler için değil: `only `char` and numeric types are allowed in range patterns`. Metinler (`&str`) sıralanabilir ama derleyici bunları aralık olarak sayamaz.
  bad: |
    fn grup(isim: &str) -> u8 {
        match isim {
            "A"..="M" => 1,
            _ => 2,
        }
    }

    fn main() {
        println!("{}", grup("Kemal"));
    }
  fix: |
    fn grup(isim: &str) -> u8 {
        match isim.chars().next() {
            Some('A'..='M') => 1,
            _ => 2,
        }
    }

    fn main() {
        println!("{} {}", grup("Kemal"), grup("Selin"));
    }
  fix_explanation: |
    Karşılaştırmayı metnin **ilk karakterine** (`char`) çevirdik ve `Some('A'..='M')` kalıbını kullandık. Metinler için `match`'te tam eşleşme veya `if` ile karşılaştırma kullanılır.

- code: E0408
  title: "Alternatif kalıplarda değişken uyuşmazlığı"
  module: m21
  explanation: |
    `|` ile birleştirilmiş kalıpların hepsi **aynı değişken kümesini** bağlamalıdır: `variable `n` is not bound in all patterns`. `Some(n) | None` kalıbında `None` kolu `n` bağlamıyor, bu yüzden gövdede `n` güvenle kullanılamaz.
  bad: |
    fn main() {
        let secim: Option<u32> = Some(3);
        match secim {
            Some(n) | None => println!("seçim işlendi"),
        }
    }
  fix: |
    fn main() {
        let secim: Option<u32> = Some(3);
        match secim {
            Some(n) => println!("{n} seçildi"),
            None => println!("seçim yok"),
        }
    }
  fix_explanation: |
    Kalıpları ayrı kollara böldük: `Some(n)` ve `None`'un kendi davranışları var. Değişken kullanmıyorsan `Some(_) | None` yazılabilir.

- code: E0416
  title: "Kalıpta yinelenen değişken adı"
  module: m21
  explanation: |
    Aynı kalıpta bir ad iki kez bağlanamaz: `identifier `x` is bound more than once in the same pattern`. `(x, x)` "iki elemanı aynıysa eşleş" anlamına gelmez; Rust'ta kalıplar eşitlik karşılaştırmak için değil, değer **bağlamak** içindir.
  bad: |
    fn main() {
        let nokta = (3, 3);
        match nokta {
            (x, x) => println!("köşegen üzerinde: {x}"),
        }
    }
  fix: |
    fn main() {
        let nokta = (3, 3);
        match nokta {
            (x, y) if x == y => println!("köşegen üzerinde: {x}"),
            (x, y) => println!("köşegen dışında: ({x}, {y})"),
        }
    }
  fix_explanation: |
    İki ayrı değişken bağlayıp eşitliği **koruma (guard)** ile kontrol ettik: `(x, y) if x == y`.

- code: E0527
  title: "Dizi kalıbı uzunluk uyuşmazlığı"
  module: m21
  explanation: |
    Dizi kalıbı, dizinin uzunluğuyla tam olarak eşleşmelidir: `pattern requires 2 elements but array has 3`. Dizi uzunluğu tipin parçasıdır, bu yüzden derleyici kalıbı derleme zamanında denetler.
  bad: |
    fn main() {
        let rgb = [255, 128, 0];
        let [kirmizi, yesil] = rgb;
        println!("{kirmizi} {yesil}");
    }
  fix: |
    fn main() {
        let rgb = [255, 128, 0];
        let [kirmizi, yesil, mavi] = rgb;
        let [ilk, ..] = rgb;
        println!("{kirmizi} {yesil} {mavi} / {ilk}");
    }
  fix_explanation: |
    Tüm elemanları yazdık. Yalnızca bazılarıyla ilgileniyorsan `[ilk, ..]` gibi **`..`** ile geri kalanları atla.

- code: E0191
  title: "trait nesnesinde ilişkili tip eksik"
  module: m22
  explanation: |
    `dyn Iterator` yazdığında `Iterator`'ın ilişkili tipi `Item`'ın ne olduğunu da belirtmelisin: `the value of the associated type `Item` in `Iterator` must be specified`. Çünkü derleyici trait nesnesinin metotlarının hangi tipleri döndüreceğini bilmek zorundadır.
  bad: |
    fn sayilar() -> Box<dyn Iterator> {
        Box::new(1..4)
    }

    fn main() {
        for s in sayilar() {
            println!("{s}");
        }
    }
  fix: |
    fn sayilar() -> Box<dyn Iterator<Item = i32>> {
        Box::new(1..4)
    }

    fn main() {
        for s in sayilar() {
            println!("{s}");
        }
    }
  fix_explanation: |
    `Item` tipini açıkça yazdık: `dyn Iterator<Item = i32>`.

- code: E0223
  title: "Belirsiz ilişkili tip"
  module: m22
  explanation: |
    `Kutu::Oge` yazdığında derleyici `Oge`'nin hangi trait'ten geldiğini bilemez; çünkü aynı adlı ilişkili tip birden çok trait'te olabilir: `ambiguous associated type`.

    Çözüm, "hangi tip, hangi trait'e göre" sorusunu **tam nitelikli (fully qualified)** söz dizimiyle yanıtlamaktır.
  bad: |
    trait Kap {
        type Oge;
        fn al(&self) -> Self::Oge;
    }

    struct Kutu;

    impl Kap for Kutu {
        type Oge = i32;
        fn al(&self) -> i32 {
            7
        }
    }

    fn main() {
        let x: Kutu::Oge = Kutu.al();
        println!("{x}");
    }
  fix: |
    trait Kap {
        type Oge;
        fn al(&self) -> Self::Oge;
    }

    struct Kutu;

    impl Kap for Kutu {
        type Oge = i32;
        fn al(&self) -> i32 {
            7
        }
    }

    fn main() {
        let x: <Kutu as Kap>::Oge = Kutu.al();
        println!("{x}");
    }
  fix_explanation: |
    `<Kutu as Kap>::Oge` yazdık: `Kutu` tipini `Kap` trait'i olarak görüp onun `Oge` tipini seçiyoruz.

- code: E0790
  title: "Tam nitelikli çağrı gerekli"
  module: m22
  explanation: |
    `Uretici::uret()` çağrısında derleyici **hangi tipin** uygulamasını çalıştıracağını bilemez; çünkü fonksiyon `self` almaz ve dönüş tipi (`u32`) de uygulayan tipi belirtmez: `cannot call associated function on trait without specifying the corresponding `impl` type`.
  bad: |
    trait Uretici {
        fn uret() -> u32;
    }

    struct Zar;

    impl Uretici for Zar {
        fn uret() -> u32 {
            4
        }
    }

    fn main() {
        let x = Uretici::uret();

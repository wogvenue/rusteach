id: m24
title: Unsafe Rust ve FFI
subtitle: Derleyicinin göremediği yerde sorumluluğu almak — ham işaretçiler, C ile konuşmak, bellek düzeni
icon: "☢️"
description: |
  Rust'ın güvenlik garantilerinin altındaki katmana ineceksin: `unsafe`'in beş süper gücünü, ham
  işaretçileri (`*const T`, `*mut T`) ve işaretçi aritmetiğini öğreneceksin. `split_at_mut` gibi
  **güvenli soyutlamaları** kendi ellerinle inşa edecek, `// SAFETY:` yorumlarıyla sözleşmeleri
  belgeleyeceksin. `unsafe extern "C"` ile C fonksiyonlarını çağırıp Rust fonksiyonlarını C'ye açacak,
  `static mut`, `unsafe trait`, `union` ve **tanımsız davranış (undefined behavior)** kavramlarını
  tanıyacaksın. Son olarak `size_of`, `align_of`, `repr(C)` ve niş (niche) optimizasyonuyla verinin bellekte
  nasıl dizildiğini göreceksin.
lessons:

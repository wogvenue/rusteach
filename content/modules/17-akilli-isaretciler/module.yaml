id: m17
title: Akıllı İşaretçiler
subtitle: Box, Rc, RefCell ve Weak — sahipliği esnetmek, güvenliği korumak
icon: "📦"
description: |
  Şimdiye kadar her değerin tek bir sahibi vardı ve ödünç alma kuralları derleme zamanında denetleniyordu.
  Bu modülde bu kuralları **bozmadan esneten** araçları öğreneceksin: heap'te tek sahip için `Box<T>`,
  kendi işaretçi tiplerin için `Deref` ve `Drop`, birden çok sahip için `Rc<T>`, paylaşılan veriyi
  değiştirmek için `RefCell<T>` ve `Cell<T>`, döngüleri kırmak için `Weak<T>`. Modülün sonunda
  özyinelemeli veri yapıları, ağaçlar ve paylaşılan durum içeren programları doğru işaretçiyi seçerek
  tasarlayabileceksin.

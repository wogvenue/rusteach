id: m12
title: Yaşam Süreleri (Lifetimes)
subtitle: Borrow checker'ın dilini konuşmak — referanslar ne kadar yaşar?
icon: "⏳"
description: |
  Modül 5'ten beri derleyici "yeterince uzun yaşamıyor" dediğinde arka planda **yaşam süreleri (lifetimes)**
  hesaplıyordu. Bu modülde o hesabı görünür kılacaksın: `'a` anotasyonlarını okuyup yazmayı, referans tutan
  struct'lar tasarlamayı, elision kurallarını, `'static`'in gerçek anlamını ve `T: 'a` sınırlarını öğreneceksin.
  Modülün sonunda generic'ler, trait sınırları ve yaşam sürelerini aynı imzada rahatça okuyabilecek, kopyasız
  (zero-copy) çalışan bir metin ayrıştırıcı yazabileceksin.

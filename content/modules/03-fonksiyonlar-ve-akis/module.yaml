id: m03
title: Fonksiyonlar ve Kontrol Akışı
subtitle: Kodunu parçalara böl, karar ver, tekrarla
icon: "🔀"
description: |
  Bu modülde kendi fonksiyonlarını yazacak, Rust'ta neredeyse her şeyin bir **ifade** olduğu fikrini
  kavrayacak ve programlarına karar verme (`if`) ile tekrar etme (`loop`, `while`, `for`) yeteneği
  kazandıracaksın. Derleyicinin en sık verdiği hataları (`E0308`, `E0317`, `E0571`...) okuyup düzeltmeyi
  öğreneceksin. Modülün sonunda hepsini birleştirip bilgisayarında çalışan gerçek bir **sayı tahmin
  oyunu** yazacaksın.
lessons:

id: m18
title: Korkusuz Eşzamanlılık
subtitle: Thread'ler, kanallar, kilitler — veri yarışı olmadan bütün çekirdekleri kullanmak
icon: "🧵"
description: |
  Bilgisayarındaki bütün çekirdekleri işe koşmayı öğreneceksin: `thread::spawn` ile thread açmak,
  `join` ile sonuç toplamak, kanallarla (`mpsc`) mesajlaşmak, `Arc<Mutex<T>>` ile durumu paylaşmak.
  `Send` ve `Sync` trait'lerinin derleyiciye **veri yarışlarını (data race)** nasıl yakalattığını,
  `RwLock` ve atomiklerin ne zaman doğru araç olduğunu, `thread::scope` ve `rayon` ile tek satırda
  paralelliği keşfedeceksin. Modülün sonunda eşzamanlı kodu korkmadan, derleyiciyi yanına alarak yazabileceksin.
lessons:

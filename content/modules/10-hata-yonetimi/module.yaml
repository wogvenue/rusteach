id: m10
title: Hata Yönetimi
subtitle: "panic!, Result ve ? ile sağlam programlar"
icon: "🧯"
description: |
  Her program bir gün hatayla karşılaşır; ustalık, hatayı doğru yerde ve doğru araçla ele almaktır.
  Bu modülde kurtarılamaz hatalar için `panic!`'i, beklenen hatalar için `Result`'ı ve hataları zarifçe
  yaymak için `?` operatörünü öğreneceksin. `Option` ile `Result` arasında köprü kuracak, kendi hata
  tiplerini tasarlayacak ve her durumda "panik mi, `Result` mı?" sorusunu gerekçesiyle cevaplayabileceksin.

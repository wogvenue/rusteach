id: m01
title: Merhaba Rust
subtitle: "Programlamaya ilk adım: Rust'ı kur, ilk programını yaz, derleyiciyle dost ol"
icon: "🦀"
description: |
  Programın ne olduğunu, Rust'ın hangi sorunu çözmek için doğduğunu ve bu uygulamayla en verimli
  nasıl öğreneceğini keşfedeceksin. Rust'ı Windows'a kuracak, `rustc` ve `cargo` ile ilk
  programlarını derleyip çalıştıracak, `println!` ile çıktıyı hizalayıp biçimlendirmeyi
  öğreneceksin. Modülün sonunda derleyicinin hata mesajlarını bir öğretmenin notları gibi okuyup
  kodunu kendi başına düzeltebileceksin.

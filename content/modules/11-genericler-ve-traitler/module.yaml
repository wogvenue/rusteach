id: m11
title: Generic'ler ve Trait'ler
subtitle: "Bir kez yaz, her tiple kullan: çalışma zamanında sıfır maliyetle"
icon: "🧩"
description: |
  Kodunu tiplerden bağımsız hâle getirmeyi (**generic'ler**) ve farklı tiplere ortak davranış
  kazandırmayı (**trait'ler**) öğreneceksin. `derive`'ın perde arkasını, trait sınırlarını, `Display`,
  `From`, `TryFrom`, `FromStr` ve `Error` gibi standart trait'leri kendi tiplerine uygulamayı; orphan rule,
  blanket impl ve const generic'leri keşfedeceksin. Modülün sonunda standart kütüphanenin imzalarını bir
  cümle gibi okuyabilecek ve Modül 10'daki hata yönetimini `?` ile tamamen otomatikleştirebileceksin.

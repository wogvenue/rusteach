id: m19
title: Async/Await
subtitle: Binlerce işi tek thread'de bekletmeden yürütmek — future'lar, tokio ve görevler
icon: "⚡"
description: |
  Ağdan cevap, diskten veri, zamanlayıcıdan sinyal beklerken thread'leri boşa harcamadan binlerce işi aynı anda
  yürütmeyi öğreneceksin. `async fn` ve `.await` ile tembel **future**'lar yazacak, **tokio** runtime'ında
  `spawn`, `join!`, `select!`, `JoinSet` ve `timeout` ile görevleri yöneteceksin. Async kanallar, `Mutex` ve
  `Semaphore` ile görevler arasında güvenle veri paylaşacak; `Future` trait'inin, `poll`'un, `Waker`'ın ve
  `Pin`'in perde arkasını göreceksin. Modülün sonunda executor'ı bloklamak, `.await`'i unutmak, iptal
  güvenliği gibi tuzaklardan kaçınarak thread ile async arasında bilinçli seçim yapabileceksin.

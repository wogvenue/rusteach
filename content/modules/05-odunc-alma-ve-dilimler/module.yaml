id: m05
title: Ödünç Alma ve Dilimler
subtitle: Sahipliği vermeden kullanmak — referanslar, kurallar ve dilimler
icon: "🔗"
description: |
  Bir değeri sahipliğini devretmeden **ödünç vermeyi** öğreneceksin: `&` ile okumak, `&mut` ile
  değiştirmek ve Rust'ın ünlü kuralı "ya tek `&mut` ya da istediğin kadar `&`". Sarkan referansların
  neden derlenmediğini, `&str` ve `&[T]` dilimleriyle bir koleksiyonun parçasıyla güvenle çalışmayı
  göreceksin. Modülün sonunda ödünç hatalarını üç soruyla çözümleyip bilinçli düzeltmeler yapabileceksin.
